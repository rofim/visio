name: Common AWS Pipeline Steps

on:
  workflow_call:
    inputs:
      apps:
        description: 'Space-separated apps, each one deployed by the pipeline rofim-<environment>-<app>. Append @<region> when the pipeline is not in eu-west-1.'
        required: true
        type: string
      environment:
        required: true
        type: string

jobs:
  deploy:
    name: Start AWS pipelines on ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Select AWS role
        env:
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          case "$ENVIRONMENT" in
            prod) account=241426737767 ;;
            preprod) account=547620973306 ;;
            staging | test1 | test2) account=124653856901 ;;
            *) echo "::error::Unknown environment $ENVIRONMENT" && exit 1 ;;
          esac
          echo "Assuming arn:aws:iam::$account:role/GithubActions"
          echo "AWS_ROLE_ARN=arn:aws:iam::$account:role/GithubActions" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: eu-west-1
        env:
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 5

      - name: Start AWS pipelines and wait for them
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          APPS: ${{ inputs.apps }}
          AWS_RETRY_MODE: adaptive
          AWS_MAX_ATTEMPTS: 5
        run: bash .github/scripts/start-aws-pipelines.sh "$ENVIRONMENT" "$GITHUB_SHA" $APPS
